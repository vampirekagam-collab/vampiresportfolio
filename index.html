<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vampire – Roblox Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#ece8df;--dim:#8a8794;--acc:#e11d2e;--ln:#1d1b24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#ece8df}}
:root[data-theme="dark"]{--bg:#000;--ink:#ece8df}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
h1,h2{font-family:Syne,sans-serif;font-weight:800;margin:0;letter-spacing:-.02em}
.serif{font-family:"Instrument Serif",serif;font-style:italic}
nav{position:absolute;z-index:5;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:20px 5vw;font-weight:500}
nav a{color:var(--ink);text-decoration:none;margin-left:22px;font-size:14px}nav a:hover{color:var(--acc)}
.hero{position:relative;height:100svh;min-height:520px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 5vw 9vh;background:#000 center/cover no-repeat;--x:50%;--y:50%;cursor:none}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle 220px at var(--x) var(--y),rgba(0,0,0,0) 0,rgba(0,0,0,.55) 55%,#000 100%)}
.ring{position:absolute;left:var(--x);top:var(--y);width:200px;height:200px;margin:-100px;border:1px solid var(--acc);border-radius:50%;opacity:.5;pointer-events:none}
.hero h1{position:relative;font-size:clamp(46px,11vw,160px);line-height:.92;color:transparent;-webkit-text-stroke:1.5px var(--ink);pointer-events:none}
.hero p{position:relative;max-width:46ch;font-size:clamp(20px,2.4vw,30px);line-height:1.25;margin:18px 0 0;pointer-events:none}
.hint{position:absolute;right:5vw;bottom:9vh;color:var(--dim);font-size:13px}
section{padding:12vh 5vw 4vh}
h2{font-size:clamp(30px,5vw,60px);margin-bottom:6px}
.sub{color:var(--dim);max-width:52ch;margin:0 0 26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chips button{background:none;color:var(--dim);border:1px solid var(--ln);border-radius:99px;padding:7px 16px;font:500 14px "DM Sans";cursor:pointer}
.chips button.on{background:var(--ink);color:#000;border-color:var(--ink)}
.grid{columns:3 280px;column-gap:16px}
.grid figure{margin:0 0 16px;position:relative;break-inside:avoid;border:1px solid var(--ln);overflow:hidden;cursor:zoom-in;background:#08070b}
.grid img{display:block;width:100%;transition:transform .5s,filter .5s;filter:saturate(.85)}
.grid figure:hover img{transform:scale(1.05);filter:none}
.grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,#000);font-size:14px}
.grid figcaption b{display:block;font-family:Syne;font-weight:700}
.grid figcaption span{color:var(--acc);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:5vw}
@media (max-width:760px){.two{grid-template-columns:1fr}nav a{margin-left:14px}}
.q{border-left:1px solid var(--ln);margin-left:8px;padding-left:26px}
.q div{position:relative;padding-bottom:26px}
.q div::before{content:"";position:absolute;left:-33px;top:6px;width:13px;height:13px;border:1px solid var(--acc);background:#000;transform:rotate(45deg)}
.q b{font-family:Syne;font-weight:700}.q p{margin:2px 0 0;color:var(--dim);font-size:15px}
.dlg{border:1px solid var(--ink);padding:22px;position:relative;margin-top:14px;min-height:230px;background:#000}
.dlg .who{position:absolute;top:-13px;left:18px;background:var(--ink);color:#000;padding:1px 14px;font:700 13px Syne}
#dt{min-height:76px;font-size:17px}
#do button{display:block;background:none;border:0;border-left:2px solid var(--ln);color:var(--ink);padding:6px 14px;margin:5px 0;font:italic 22px "Instrument Serif";cursor:pointer;text-align:left}
#do button:hover{border-color:var(--acc);color:var(--acc);padding-left:22px}
.tog{margin-top:10px;font-size:13px;color:var(--dim)}.tog button{background:none;border:1px solid var(--ln);color:var(--ink);padding:3px 10px;cursor:pointer;font:inherit}
.ctc{display:flex;gap:14px;flex-wrap:wrap}
.ctc button{background:none;border:1px solid var(--ink);color:var(--ink);padding:14px 24px;font:700 16px Syne;cursor:pointer}
.ctc button:hover{background:var(--ink);color:#000}
footer{padding:8vh 5vw 6vh;color:var(--dim);font-size:13px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;padding:20px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:78vh;border:1px solid var(--ln)}
.lb p{margin:14px 0 0;text-align:center;max-width:60ch}
.toast{color:#fff!important;position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--acc);color:#000;padding:8px 18px;font-weight:500;opacity:0;transition:.3s;z-index:30}.toast.on{opacity:1}
@media (hover:none){.hero{cursor:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.all{background:none;border:1px solid var(--ink);color:var(--ink);padding:8px 18px;font:700 13px Syne;cursor:pointer;margin-bottom:26px}.all:hover{background:var(--acc);border-color:var(--acc);color:#000}
.v{border-top:1px solid var(--ln)}.v:last-child{border-bottom:1px solid var(--ln)}
.vh{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:20px;padding:26px 0;cursor:pointer;background:linear-gradient(var(--acc),var(--acc)) no-repeat left/0% 100%;transition:background-size .55s cubic-bezier(.7,0,.2,1),padding .4s,color .3s;clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%)}
.vh:hover,.v.on .vh{background-size:100% 100%;color:#000;padding-left:24px}
.vh:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.vn{font:800 clamp(26px,4.5vw,56px)/1 Syne;letter-spacing:-.02em}
.vc{margin-left:auto;font-size:13px;opacity:.8}
.vp{width:26px;font:700 30px Syne;transition:transform .4s;margin-right:34px}.v.on .vp{transform:rotate(45deg)}
.vb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s ease}.v.on .vb{grid-template-rows:1fr}.vb>div{overflow:hidden;min-height:0}.vbi{padding:26px 0 44px}
.chips button:hover{color:var(--ink)}.chips button.on{background:var(--acc);border-color:var(--acc);color:#000}
.dlg .who{background:var(--acc)}#do button:hover{border-color:var(--acc)}

.hv{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 5vw 11vh;overflow:hidden;background:#000}
.hv::after{content:"";position:absolute;top:0;left:50%;width:1px;height:12vh;background:linear-gradient(var(--acc),transparent)}
#em{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.halo,.rings{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);aspect-ratio:1;pointer-events:none}
.halo{width:min(95vw,860px);background:radial-gradient(circle,rgba(225,29,46,.3),rgba(225,29,46,0) 62%);animation:br 6s ease-in-out infinite}
.rings{width:min(82vw,660px)}
.rings i{position:absolute;inset:0;border:1px solid rgba(225,29,46,.5);border-radius:50%}
.rings i+i{inset:-9%;border:1px dashed rgba(236,232,223,.2);animation:sp 80s linear infinite}
.bat{position:relative;width:min(78vw,700px);filter:drop-shadow(0 0 20px rgba(225,29,46,.6)) drop-shadow(0 0 60px rgba(225,29,46,.3));animation:fl 7s ease-in-out infinite}
.hv h1{position:relative;margin:26px 0 0;font:700 clamp(38px,9vw,116px)/1 Cinzel,serif;letter-spacing:.2em;padding-left:.2em;background:linear-gradient(#f6f7fb 28%,#2a2c36 48%,#d0d3dd 54%,#8d909c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(225,29,46,.45))}
.sub2{position:relative;font-size:clamp(20px,2.6vw,32px);margin:14px 0 0}
.cue{position:absolute;bottom:3.5vh;left:50%;transform:translateX(-50%);color:var(--dim);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cue::after{content:"";width:1px;height:34px;background:linear-gradient(var(--acc),transparent);transform-origin:top;animation:dr 2.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}@keyframes br{50%{opacity:.6;transform:translate(-50%,-50%) scale(1.07)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes dr{0%{transform:scaleY(0)}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.bat,.halo,.rings i,.cue::after{animation:none!important}}
</style></head><body>
